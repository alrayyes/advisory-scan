# The scan half of rules/dependencies.md, on this repo's own tooling
# lockfile, using the action from this checkout. Daily for advisories
# published against pins that haven't moved, on a lockfile push so a fix
# closes the ticket straight away, and by hand.
name: advisory-scan

on:
  schedule:
    - cron: "37 5 * * *"
  push:
    branches: [main]
    paths: [package.json, bun.lock, action.yml, scripts/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: ./
        with:
          mode: scan
          command: bun audit
          labels: dependencies

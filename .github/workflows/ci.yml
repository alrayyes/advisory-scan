name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Works out which filtered jobs a pull request touches (rules/ci.md). A job
  # skipped by `if:` reports success, so the `ci-ok` aggregator below can be
  # the one required check. A push to main runs everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prose: ${{ steps.groups.outputs.prose }}
      code: ${{ steps.groups.outputs.code }}
      audit: ${{ steps.groups.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'prose=true\ncode=true\naudit=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prose=false code=false audit=false
          while IFS= read -r path; do
            case "$path" in
              *.md | styles/* | .vale.ini | .ltex.json | scripts/lint-vale.sh | scripts/lint-ltex.sh) prose=true ;;
            esac
            # The tests read everything under scripts/ and tests/.
            case "$path" in
              action.yml | scripts/* | tests/* | .shellcheckrc) code=true ;;
            esac
            # The audit job runs the action on this repo's own lockfile, so
            # it's the dependency check and the action's live test at once.
            case "$path" in
              package.json | bun.lock | action.yml | scripts/*) audit=true ;;
            esac
            case "$path" in
              .github/workflows/ci.yml) prose=true code=true audit=true ;;
            esac
          done < <(git diff --name-only "$BASE...HEAD")
          printf 'prose=%s\ncode=%s\naudit=%s\n' "$prose" "$code" "$audit" >> "$GITHUB_OUTPUT"

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  # Cheap, so never filtered: there's always a status on every pull request.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint:md
      - run: ./scripts/lint-shell.sh
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color

  # ubuntu-22.04, not 24.04: kcov isn't packaged for 24.04 (hush-hush-action
  # found the same). Coverage is for visibility, in the job summary, not a
  # target (rules/testing.md).
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ubuntu's packaged bats is 1.2.1; the tests need 1.5+ for
      # --separate-stderr. Fetched by the v1.14.0 commit, not the tag, since
      # a tag can move and this runs under sudo. kcov comes from apt.
      - name: Install bats-core and kcov
        env:
          BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5 # v1.14.0
        run: |
          git init --quiet /tmp/bats-core
          git -C /tmp/bats-core fetch --quiet --depth 1 https://github.com/bats-core/bats-core.git "$BATS_COMMIT"
          git -C /tmp/bats-core checkout --quiet FETCH_HEAD
          sudo /tmp/bats-core/install.sh /usr/local
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kcov
      - name: bats, under kcov
        run: kcov --include-path="$PWD/scripts" coverage-out bats tests/
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          report=coverage-out/kcov-merged/coverage.json
          [ -f "$report" ] || report=$(find coverage-out -path "*/bats*/coverage.json" | head -n 1)
          {
            echo "### Line coverage of scripts/ (kcov)"
            echo
            echo "| File | Covered |"
            echo "| --- | --- |"
            jq -r '.files[] | "| \(.file | sub(".*/scripts/"; "scripts/")) | \(.percent_covered)% |"' "$report"
            jq -r '"| **Total** | **\(.percent_covered)%** |"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

  # The same suite on Alpine, where grep, sed, awk and timeout are
  # BusyBox's: the shape of a Forgejo `docker` runner's container. Caught
  # two real differences (empty grep pattern files, timeout's exit code).
  test-busybox:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: alpine:3.22.6@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    steps:
      # bats from Alpine's own repository (1.11+), git for checkout and the
      # gate tests, python3 for scan mode's fake API.
      - run: apk add --no-cache bash git curl jq python3 bats
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bats tests/

  # Dogfood: this repo's own tooling lockfile, audited by the action at the
  # pull request's head, in gate mode.
  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: ./
        with:
          mode: gate
          command: bun audit

  # setup-go's problem matcher against the action's log, on a real runner
  # (#9): a control line printed before the action must become an
  # annotation, proving the matcher is live, and the trace line the action
  # logs must not.
  matcher:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.14"
          cache: false
      - name: Control line for the matcher
        run: 'echo "matcher/control.go:1:1: problem-matcher control line, expected"'
      - uses: ./
        with:
          mode: gate
          command: 'echo "internal/forgejo/forgejo.go:93:21: forgejo.Client.SetArchived calls fmt.Sprintf"'
      - name: Only the control line was annotated
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          job="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --jq '.jobs[] | select(.name == "matcher") | .id')"
          annotations="$(gh api "repos/$REPO/check-runs/$job/annotations")"
          control="$(jq '[.[] | select(.message | contains("problem-matcher control line"))] | length' <<<"$annotations")"
          trace="$(jq '[.[] | select(.message | contains("SetArchived"))] | length' <<<"$annotations")"
          echo "control annotations: $control, trace annotations: $trace"
          [ "$control" -ge 1 ] || { echo "::error::The matcher never fired, so this check proves nothing."; exit 1; }
          [ "$trace" -eq 0 ] || { echo "::error::The action's output was annotated by setup-go's matcher."; exit 1; }

  # Grammar, spelling, the phonetic article: mechanics have a right answer,
  # so this fails the build.
  mechanics:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus:18.7.0@sha256:00c30809802234d6c43b0ce0b295075bd0aff9c576aaba57433bc8baf314398c
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-ltex.sh

  # Style is advice: only Vale.Terms (error severity) fails the job.
  style:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-vale.sh

  # The single required check. Passes when every job above passed or was
  # skipped by its filter, and fails on any failure or cancellation.
  ci-ok:
    if: always()
    needs:
      [
        changes,
        commitlint,
        lint,
        test,
        test-busybox,
        matcher,
        audit,
        mechanics,
        style,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: commitlint, test, test-busybox, matcher, audit, mechanics, style
          jobs: ${{ toJSON(needs) }}

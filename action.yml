name: "Advisory scan"
description: >-
  Runs your ecosystem's dependency audit and fails a pull request only on
  the advisories it introduces over its base, or scans the default branch
  and keeps one ticket listing what it finds.
author: "alrayyes"
branding:
  icon: "shield"
  color: "gray-dark"

inputs:
  mode:
    description: >-
      gate: on a pull request, audit the head and the base and fail only on
      advisory IDs the head has that the base doesn't. scan: on the default
      branch, audit and create, update or close the one open ticket titled
      by the title input.
    required: true
  command:
    description: >-
      The audit to run, in bash, such as "bun audit" or "composer audit".
      It must exit non-zero when it finds an advisory. Advisory IDs (GHSA,
      CVE, PKSA, GO, PYSEC, RUSTSEC) are read from its output. It runs as
      one command even if it spans several lines.
    required: false
    default: ""
  commands:
    description: >-
      More audits, one per line, for a job that covers several ecosystems,
      such as "bun audit" and a govulncheck line. Each runs on its own with
      its own retries, timeout and verdict, and the IDs of the ones that
      found something are combined. If any of them errors without naming an
      advisory, the whole step is an error. Runs after command, if both are
      set; one of the two is required.
    required: false
    default: ""
  setup:
    description: >-
      Optional command run before the audit in the same directory, and
      again on the base checkout in gate mode, such as "composer install
      --no-scripts".
    required: false
    default: ""
  working-directory:
    description: "Directory to run in, relative to the workspace."
    required: false
    default: "."
  base-sha:
    description: >-
      Gate mode: the commit to compare against. Defaults to the pull
      request's base, or the previous commit on a push.
    required: false
    default: ""
  token:
    description: >-
      Scan mode: a token that can write issues, and nothing more. On
      GitHub, the job's own token with `issues: write`; on Forgejo, a token
      scoped to write:issue if the automatic one can't. setup and command
      never see it.
    required: false
    default: ${{ github.token }}
  title:
    description: "Scan mode: the ticket's title, and how the next run finds it."
    required: false
    default: "Dependency advisories"
  labels:
    description: >-
      Scan mode: comma-separated labels for a new ticket, such as
      "dependencies,security". On Forgejo they must already exist.
    required: false
    default: ""
  timeout-seconds:
    description: >-
      Time limit for each of the three audit attempts. An attempt that runs
      out counts as a tool error, not a finding.
    required: false
    default: "300"

outputs:
  advisories:
    description: "Every advisory ID the audit named, space-separated."
    value: ${{ steps.run.outputs.advisories }}
  introduced:
    description: "Gate mode: the IDs the head introduces, space-separated."
    value: ${{ steps.run.outputs.introduced }}
  issue:
    description: "Scan mode: the ticket's number, if there is or was one."
    value: ${{ steps.run.outputs.issue }}

runs:
  using: "composite"
  steps:
    - name: Audit
      id: run
      shell: bash
      env:
        ADVISORY_MODE: ${{ inputs.mode }}
        AUDIT_COMMAND: ${{ inputs.command }}
        AUDIT_COMMANDS: ${{ inputs.commands }}
        SETUP_COMMAND: ${{ inputs.setup }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        AUDIT_TIMEOUT: ${{ inputs.timeout-seconds }}
        ADVISORY_TOKEN: ${{ inputs.token }}
        ISSUE_TITLE: ${{ inputs.title }}
        ISSUE_LABELS: ${{ inputs.labels }}
        BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha || github.event.before }}
      run: '"${{ github.action_path }}/scripts/advisory-scan.sh"'

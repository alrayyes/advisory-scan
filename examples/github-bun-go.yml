# GitHub Actions, bun and Go in one repo. Copy into .github/workflows/ and
# replace the advisory-scan SHA with the commit of the release you want.
#
# Each audit is its own line in `commands`, so each gets its own retries
# and verdict: an outage in govulncheck can't hide behind the braces ID bun
# audit always prints (alrayyes/advisory-scan#8).
name: audit

# Pull requests run the gate; the default branch runs the scan, daily, on a
# dependency push and by hand. govulncheck reports only advisories the code
# can reach, so Go source counts as a dependency change here.
on:
  # No `paths:` here: a workflow skipped by a path filter never reports, so
  # a required gate would block every pull request that touches no
  # dependency. To filter, use the `changes` job in the README's "Running the
  # gate only when dependencies change".
  pull_request:
  push:
    branches: [main]
    paths:
      [
        package.json,
        bun.lock,
        go.mod,
        go.sum,
        "**/*.go",
        .github/workflows/audit.yml,
      ]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: alrayyes/advisory-scan@0000000000000000000000000000000000000000 # vX.Y.Z
        with:
          mode: gate
          commands: |
            bun audit
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: alrayyes/advisory-scan@0000000000000000000000000000000000000000 # vX.Y.Z
        with:
          mode: scan
          commands: |
            bun audit
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          labels: dependencies

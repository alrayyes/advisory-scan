config:
  default: true
  MD013: false
  MD033: false

ignores:
  - node_modules
  - CHANGELOG.md
  - .claude
  # OpenSpec's own artifacts start at `## Why` by the tool's convention.
  - "openspec/**"
  # Vale's downloaded style packages: somebody else's docs.
  - "styles/Google/**"
  - "styles/proselint/**"

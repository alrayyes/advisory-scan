StylesPath = styles
MinAlertLevel = warning
Packages = Google, proselint
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint

# The vocabulary spells every product name the way it's meant to be spelled,
# and this holds the prose to it.
Vale.Terms = YES

# Spelling is LTeX's: LanguageTool's dictionary already knows technical
# words this list doesn't. Two tools underlining the same word teaches
# people to ignore both.
Vale.Spelling = NO

# One maintainer, and the docs address "you".
Google.We = NO

# House style spaces em dashes.
Google.EmDash = NO

# SECURITY.md's headings follow this account's template verbatim.
Google.Headings = NO

# House style: punctuation outside the quotation marks unless it was quoted.
Google.Quotes = NO
